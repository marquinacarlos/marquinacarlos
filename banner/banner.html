<!doctype html>
<!-- Source of the profile banner. Open with ?theme=dark or ?theme=light; render.sh takes the screenshots. -->
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&family=Geist+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
  :root {
    --bg: #0c090c;
    --fg: #fafafa;
    --muted: #a89ea9;
    --border: #ffffff1a;
    --accent: #ff2357;
    --c1: #ffa2ae;
    --c2: #ff2357;
    --c3: #e70044;
    --c4: #c20039;
    --c5: #a30037;
    --ok: #00bb7f;
  }
  :root[data-theme="light"] {
    --bg: #ffffff;
    --fg: #0c090c;
    --muted: #79697b;
    --border: #e7e4e7;
    --accent: #c20039;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; background: transparent; }

  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    border-radius: 24px;
    border: 2px solid var(--border);
    background: var(--bg);
    font-family: "Geist", sans-serif;
    color: var(--fg);
  }

  .text { position: absolute; left: 96px; top: 92px; }
  .name { font-size: 76px; font-weight: 700; letter-spacing: -2px; line-height: 1; }
  .role { margin-top: 14px; font-size: 38px; font-weight: 400; color: var(--muted); }
  .meta {
    margin-top: 30px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 22px;
    font-weight: 500;
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--ok); }
  .sep { color: var(--muted); }
  .url { font-family: "Geist Mono", monospace; color: var(--accent); }

  /* Bottom band: skewed stripes in the portfolio's crimson ramp */
  .band {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 230px;
    display: flex;
    gap: 0;
  }
  .band span { flex: none; height: 100%; transform: skewX(-24deg); transform-origin: bottom; }
  .s1 { width: 120px; background: var(--c5); margin-left: -60px; }
  .s2 { width: 60px;  background: var(--c4); }
  .s3 { width: 220px; background: var(--c3); }
  .s4 { width: 40px;  background: var(--bg); }
  .s5 { width: 150px; background: var(--c2); }
  .s6 { width: 90px;  background: var(--c1); }
  .s7 { width: 30px;  background: var(--bg); }
  .s8 { width: 260px; background: var(--c4); }
  .s9 { width: 120px; background: var(--c5); }
  .s10 { width: 400px; background: var(--c3); }

  .stack {
    position: absolute;
    left: 96px;
    bottom: 46px;
    font-family: "Geist Mono", monospace;
    font-size: 20px;
    font-weight: 500;
    color: var(--fg);
    letter-spacing: 0.5px;
  }

  .photo {
    position: absolute;
    right: 92px;
    top: 150px;
    width: 330px;
    height: 330px;
    border-radius: 50%;
    border: 10px solid var(--bg);
    background: var(--bg) url("photo.png") center / cover no-repeat;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="text">
      <div class="name">Carlos Marquina</div>
      <div class="role">Full-stack Web Developer</div>
      <div class="meta">
        <span class="dot"></span>
        <span>Available now</span>
        <span class="sep">·</span>
        <span>Barcelona, Spain</span>
      </div>
      <div class="meta"><span class="url">carlosmarquina.dev</span></div>
    </div>

    <div class="band">
      <span class="s1"></span><span class="s2"></span><span class="s3"></span><span class="s4"></span>
      <span class="s5"></span><span class="s6"></span><span class="s7"></span><span class="s8"></span>
      <span class="s9"></span><span class="s10"></span>
    </div>
    <div class="stack">PostgreSQL · Express · React · Node.js</div>

    <div class="photo"></div>
  </div>
  <script>
    const theme = new URLSearchParams(location.search).get("theme") || "dark";
    document.documentElement.dataset.theme = theme;
  </script>
</body>
</html>
